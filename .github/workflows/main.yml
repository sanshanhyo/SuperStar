name: SuperStar course smoke test

on:
  workflow_dispatch:
    inputs:
      max_chapters:
        description: "要检查的前几个章节"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      confirm_read_only:
        description: "确认只读检查，不学习、不答题、不签到、不提交"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
      CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CHAOXING_USERNAME" || { echo "CHAOXING_USERNAME is not configured"; exit 1; }
          test -n "$CHAOXING_PASSWORD" || { echo "CHAOXING_PASSWORD is not configured"; exit 1; }

      - name: Confirm read-only mode
        if: ${{ inputs.confirm_read_only != true }}
        run: |
          echo "请在 Run workflow 页面勾选只读确认项"
          exit 1

      - name: Render runtime config
        run: python scripts/render_config.py --template config_template.ini --output config.ini

      - name: Run read-only course smoke test
        run: python scripts/course_smoke_test.py --config config.ini --max-chapters "${{ inputs.max_chapters }}"

      - name: Remove runtime credentials and logs
        if: always()
        run: rm -f config.ini cookies.txt chaoxing.log
