name: SuperStar three-chapter automation

on:
  workflow_dispatch:
    inputs:
      chapter_selection:
        description: "章节顺序号，留空则自动选择前三个未完成章节，例如 4,5,6"
        required: false
        default: ""
        type: string
      video_speed:
        description: "视频倍速，允许范围 1.0 到 2.0"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read

jobs:
  three-chapter-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
      CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
      TIKU_API_KEY: ${{ secrets.TIKU_API_KEY }}
      TIKU_API_ENDPOINT: https://api.shenwenai.com
      TIKU_API_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CHAOXING_USERNAME" || { echo "CHAOXING_USERNAME is not configured"; exit 1; }
          test -n "$CHAOXING_PASSWORD" || { echo "CHAOXING_PASSWORD is not configured"; exit 1; }
          test -n "$TIKU_API_KEY" || { echo "TIKU_API_KEY is not configured"; exit 1; }

      - name: Render submit-enabled runtime config
        run: >
          python scripts/render_config.py
          --template config_template.ini
          --output config.ini
          --enable-ai
          --submit
          --speed "${{ inputs.video_speed }}"

      - name: Process selected chapters serially
        run: >
          python scripts/three_chapter_automation.py
          --config config.ini
          --chapter-selection "${{ inputs.chapter_selection }}"

      - name: Remove runtime credentials and logs
        if: always()
        run: rm -f config.ini cookies.txt chaoxing.log cache.json
